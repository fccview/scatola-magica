# Minimal setup - single instance, in-memory cache only.
# Good for: personal use, single container deployments.
#
# Setup:
#   Copy this file next to your data folders as docker-compose.yml, then:
#   mkdir -p uploads/temp config cache
#   sudo chown -R 1000:1000 uploads config cache
#   docker compose up -d

services:
  scatola-magica:
    image: ghcr.io/fccview/scatola-magica:latest
    container_name: scatola-magica
    user: "1000:1000"
    ports:
      - "1133:3000"
    volumes:
      - ./uploads:/app/data/uploads:rw
      - ./config:/app/data/config:rw
      - ./cache:/app/.next/cache:rw
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # Do not change this if you use docker.
      - UPLOAD_DIR=/app/data/uploads
